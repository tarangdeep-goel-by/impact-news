# Golden Test Suite — Algorithm Comparison Harness
# Tests are algorithm-agnostic: they define expected outcomes, not mechanisms.
#
# Structure:
#   profiles: synthetic user profiles (onboarding answers → UserGraph)
#   cases: (trigger, profile) → expected scoring bands + node assertions
#
# Scoring bands:
#   HIGH:   relevance ≥ 0.5
#   MEDIUM: 0.2 ≤ relevance < 0.5
#   LOW:    0.01 ≤ relevance < 0.2
#   ZERO:   relevance < 0.01

# ============================================================
# PROFILES — synthetic users with known dependencies
# ============================================================

profiles:

  car_commuter_homeloan:
    description: "Bangalore IT worker, car commuter, home loan, stock investor"
    answers:
      city: bangalore
      employment: salaried_private
      industry: IT
      housing: own_loan
      transport: [car]
      loans: [home]
      dependents: [school_children]
      investments: [stocks, mf]
      top_expenses: [fuel_transport, children_education, groceries]
      income_range: 1l_2.5l

  student_delhi:
    description: "Student in Delhi, no loans, no investments, metro commuter"
    answers:
      city: delhi
      employment: student
      industry: Other
      housing: family
      transport: [metro]
      loans: [none]
      dependents: [none]
      investments: [none]
      top_expenses: [subscriptions_tech]
      income_range: under_25k

  retired_pune:
    description: "Retired in Pune, FD + gold investor, no loans, parents care"
    answers:
      city: pune
      employment: retired
      industry: Other
      housing: own_clear
      transport: [auto_cab]
      loans: [none]
      dependents: [none]
      investments: [fd, gold, ppf_nps]
      top_expenses: [healthcare_insurance, utilities, groceries]
      income_range: 50k_1l

  farmer_patna:
    description: "Self-employed farmer in Patna, bike commuter, business loan"
    answers:
      city: patna
      employment: self_employed
      industry: Agriculture
      housing: own_clear
      transport: [bike]
      loans: [business]
      dependents: [school_children, parents]
      investments: [gold]
      top_expenses: [groceries, fuel_transport, parents_care]
      income_range: 25k_50k

  freelancer_mumbai:
    description: "Freelance media worker in Mumbai, renter, crypto investor"
    answers:
      city: mumbai
      employment: freelance
      industry: Media
      housing: rent
      transport: [metro, auto_cab]
      loans: [credit_card]
      dependents: [none]
      investments: [crypto, stocks]
      top_expenses: [eating_out, subscriptions_tech, entertainment_travel]
      income_range: 50k_1l

# ============================================================
# CASES — (trigger, profile) → expected outcomes
# ============================================================
#
# Each case defines:
#   trigger_node: the macro event node
#   profile: which synthetic user
#   expected_band: HIGH / MEDIUM / LOW / ZERO
#   must_hit: nodes that MUST appear in impact results (true positives)
#   must_miss: nodes that MUST NOT appear (false positive traps)
#   reason: human explanation of why this is the expected outcome

cases:

  # ── Energy ──────────────────────────────────────────────

  - id: crude_oil_car_commuter
    description: "Crude oil spike → car commuter with fuel expenses"
    trigger_node: brent_crude
    profile: car_commuter_homeloan
    expected_band: HIGH
    must_hit:
      - retail_petrol
      - retail_diesel
    must_miss: []
    reason: "Direct causal chain: crude → fuel prices → commuter fuel costs"

  - id: crude_oil_student
    description: "Crude oil spike → student with no vehicle"
    trigger_node: brent_crude
    profile: student_delhi
    expected_band: LOW
    must_hit: []
    must_miss: []
    reason: "Student has no fuel dependency; only indirect via metro fare or general inflation"

  - id: crude_oil_farmer
    description: "Crude oil spike → farmer with bike"
    trigger_node: brent_crude
    profile: farmer_patna
    expected_band: MEDIUM
    must_hit:
      - retail_petrol
    must_miss: []
    reason: "Bike commuter + petrol exposure, but not as heavy as car commuter"

  # ── False Positive Traps ────────────────────────────────

  - id: gold_should_not_reach_wheat
    description: "Gold prices should NOT affect grocery costs"
    trigger_node: international_gold_prices
    profile: car_commuter_homeloan
    expected_band: ZERO
    must_hit: []
    must_miss:
      - wheat_flour
      - vegetable_prices
      - retail_petrol
    reason: "Gold is in commodities but has no causal link to food or fuel. This is the L2 bridge false positive."

  - id: gold_prices_retired_investor
    description: "Gold prices → retired gold investor"
    trigger_node: international_gold_prices
    profile: retired_pune
    expected_band: MEDIUM
    must_hit:
      - gold_loan_interest
    must_miss:
      - retail_petrol
      - wheat_flour
    reason: "Retired investor holds gold — should reach gold-related nodes only, not spill into unrelated domains"

  - id: silver_should_not_reach_fuel
    description: "Silver prices should NOT reach fuel nodes"
    trigger_node: international_silver_prices
    profile: car_commuter_homeloan
    expected_band: ZERO
    must_hit: []
    must_miss:
      - retail_petrol
      - retail_diesel
      - lpg_cylinder
    reason: "Silver is a precious metal, no causal link to fuel. Another L2 bridge false positive trap."

  # ── Monetary Policy ─────────────────────────────────────

  - id: repo_rate_homeloan
    description: "RBI repo rate hike → home loan holder"
    trigger_node: repo_rate
    profile: car_commuter_homeloan
    expected_band: HIGH
    must_hit:
      - home_loan_emi
    must_miss: []
    reason: "Direct chain: repo rate → bank lending rate → home loan EMI"

  - id: repo_rate_student
    description: "RBI repo rate hike → student with no loans"
    trigger_node: repo_rate
    profile: student_delhi
    expected_band: ZERO
    must_hit: []
    must_miss:
      - home_loan_emi
    reason: "Student has no loans or rate-sensitive investments"

  - id: repo_rate_retired_fd
    description: "RBI repo rate hike → retired FD investor"
    trigger_node: repo_rate
    profile: retired_pune
    expected_band: MEDIUM
    must_hit:
      - fd_rates
    must_miss: []
    reason: "FD rates track repo rate — retired investor benefits from rate hikes"

  # ── Weather & Agriculture ───────────────────────────────

  - id: monsoon_farmer
    description: "Poor monsoon → farmer in Patna"
    trigger_node: monsoon_systems
    profile: farmer_patna
    expected_band: HIGH
    must_hit: []
    must_miss: []
    reason: "Farmer depends on monsoon for crop yield, income, and food prices"

  - id: monsoon_it_worker
    description: "Poor monsoon → IT worker in Bangalore"
    trigger_node: monsoon_systems
    profile: car_commuter_homeloan
    expected_band: LOW
    must_hit: []
    must_miss: []
    reason: "IT worker in city — only indirect via food price inflation on groceries"

  # ── Stock Market & Global ───────────────────────────────

  - id: us_recession_it_worker
    description: "US recession fears → IT worker with stocks"
    trigger_node: us_economy
    profile: car_commuter_homeloan
    expected_band: HIGH
    must_hit:
      - equity_markets
      - it_services_sector
    must_miss: []
    reason: "IT sector depends on US economy; also holds stocks exposed to FII flows"

  - id: us_recession_farmer
    description: "US recession fears → farmer"
    trigger_node: us_economy
    profile: farmer_patna
    expected_band: ZERO
    must_hit: []
    must_miss: []
    reason: "Farmer has no US economy exposure"

  - id: crypto_regulation_freelancer
    description: "Crypto regulation news → crypto investor"
    trigger_node: crypto_regulation_india
    profile: freelancer_mumbai
    expected_band: MEDIUM
    must_hit:
      - crypto_currencies
    must_miss: []
    reason: "Freelancer holds crypto, directly affected by regulation"

  - id: crypto_regulation_retired
    description: "Crypto regulation news → retired FD investor"
    trigger_node: crypto_regulation_india
    profile: retired_pune
    expected_band: ZERO
    must_hit: []
    must_miss:
      - fd_rates
      - gold
    reason: "No crypto exposure — regulation should not reach traditional investments"

  # ── Infrastructure & Urban ──────────────────────────────

  - id: delhi_air_quality_student
    description: "Delhi AQI crisis → student in Delhi"
    trigger_node: air_pollution
    profile: student_delhi
    expected_band: MEDIUM
    must_hit: []
    must_miss: []
    reason: "Delhi student directly exposed to air pollution via city climate mapping"

  - id: delhi_air_quality_pune
    description: "Delhi AQI crisis → person in Pune"
    trigger_node: air_pollution
    profile: retired_pune
    expected_band: ZERO
    must_hit: []
    must_miss: []
    reason: "Pune resident should not be affected by Delhi-specific air quality trigger"

  # ── Education ───────────────────────────────────────────

  - id: education_policy_parent
    description: "Education policy change → parent with school children"
    trigger_node: education_policy
    profile: car_commuter_homeloan
    expected_band: MEDIUM
    must_hit:
      - school_fees
    must_miss: []
    reason: "Has school-age children, pays school fees"

  - id: education_policy_freelancer
    description: "Education policy change → childless freelancer"
    trigger_node: education_policy
    profile: freelancer_mumbai
    expected_band: ZERO
    must_hit: []
    must_miss:
      - school_fees
    reason: "No children, no education dependency"

# ============================================================
# SCORE SEPARATION — same trigger, different profiles
# ============================================================
# These test that the algorithm creates clear daylight between
# relevant and irrelevant users for the same trigger.

score_separation:

  - id: sep_crude_oil
    description: "Crude oil should score much higher for car commuter than student"
    trigger_node: brent_crude
    higher_profile: car_commuter_homeloan
    lower_profile: student_delhi
    min_ratio: 3.0
    reason: "Car commuter has direct fuel dependency; student has none"

  - id: sep_repo_rate
    description: "Repo rate should score much higher for home loan holder than student"
    trigger_node: repo_rate
    higher_profile: car_commuter_homeloan
    lower_profile: student_delhi
    min_ratio: 5.0
    reason: "Home loan EMI is directly rate-sensitive"

  - id: sep_monsoon
    description: "Monsoon should score higher for farmer than IT worker"
    trigger_node: monsoon_systems
    higher_profile: farmer_patna
    lower_profile: car_commuter_homeloan
    min_ratio: 2.0
    reason: "Farmer's livelihood depends on monsoon"

  - id: sep_gold
    description: "Gold price should score higher for gold investor than non-investor"
    trigger_node: international_gold_prices
    higher_profile: retired_pune
    lower_profile: student_delhi
    min_ratio: 3.0
    reason: "Retired investor holds gold; student has no exposure"
