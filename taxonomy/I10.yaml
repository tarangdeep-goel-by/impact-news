- from: mobile_data_tariff
  to: mobile_network_quality
  type: AFFECTS
  weight: 0.6
  polarity: -1
  delay: MEDIUM_TERM
  description: Aggressive price wars leading to lower data tariffs can reduce telecom
    companies' revenues, potentially leading to under-investment in network infrastructure
    and a degradation of network quality over time.
- from: mobile_data_tariff
  to: ott_subscription
  type: AFFECTS
  weight: 0.8
  polarity: -1
  delay: SHORT_TERM
  description: Lower mobile data tariffs reduce the cost of streaming content, making
    OTT subscriptions more attractive and affordable for a wider audience, thus increasing
    adoption.
- from: mobile_data_tariff
  to: k12_edtech
  type: AFFECTS
  weight: 0.7
  polarity: -1
  delay: SHORT_TERM
  description: Affordable mobile data is a key enabler for online education. Lower
    tariffs increase the accessibility of EdTech platforms for students, especially
    in lower-income households.
- from: mobile_data_tariff
  to: food_delivery_payouts
  type: AFFECTS
  weight: 0.5
  polarity: -1
  delay: SHORT_TERM
  description: Delivery gig workers rely on mobile data for their work. A decrease
    in data tariffs lowers their operational costs, thereby slightly increasing their
    net earnings.
- from: mobile_network_quality
  to: upi_transaction_success
  type: AFFECTS
  weight: 0.9
  polarity: 1
  delay: IMMEDIATE
  description: Poor mobile network quality, such as low signal strength or slow data
    speeds, is a primary cause of UPI transaction failures, as it disrupts communication
    with bank servers.
- from: mobile_network_quality
  to: cab_driver_earnings
  type: AFFECTS
  weight: 0.8
  polarity: 1
  delay: IMMEDIATE
  description: Ride-hailing drivers require constant, stable mobile connectivity to
    receive ride requests, navigate, and process payments. Poor network quality leads
    to missed opportunities and lower earnings.
- from: mobile_network_quality
  to: whatsapp_messaging
  type: AFFECTS
  weight: 0.9
  polarity: 1
  delay: IMMEDIATE
  description: The quality of services on messaging apps, such as call clarity and
    message delivery speed, is directly dependent on the underlying mobile network
    quality.
- from: fiber_broadband_tariff
  to: it_sector_jobs
  type: AFFECTS
  weight: 0.6
  polarity: -1
  delay: MEDIUM_TERM
  description: Lower home broadband tariffs make remote work more affordable and viable
    for a larger pool of IT professionals, potentially increasing the supply of talent
    for WFH-based roles.
- from: fiber_broadband_tariff
  to: ott_subscription
  type: AFFECTS
  weight: 0.7
  polarity: -1
  delay: SHORT_TERM
  description: Affordable high-speed broadband plans encourage households to subscribe
    to multiple OTT services for consumption on smart TVs and other devices.
- from: broadband_network_quality
  to: video_game
  type: AFFECTS
  weight: 0.8
  polarity: 1
  delay: IMMEDIATE
  description: Online gaming is highly sensitive to network quality. High latency
    (ping) and low bandwidth, indicative of poor quality, make most online multiplayer
    games unplayable.
- from: broadband_network_quality
  to: startup_jobs
  type: AFFECTS
  weight: 0.6
  polarity: 1
  delay: MEDIUM_TERM
  description: The productivity and growth of many tech startups depend on reliable,
    high-quality broadband. Poor connectivity can hinder operations and slow down
    hiring and expansion.
- from: public_wifi
  to: irctc_train_ticket
  type: AFFECTS
  weight: 0.5
  polarity: 1
  delay: IMMEDIATE
  description: The availability and quality of public WiFi at railway stations enable
    passengers to book tickets, check train status, and access other travel services
    without using their mobile data.
- from: public_wifi
  to: street_vendor_income
  type: AFFECTS
  weight: 0.4
  polarity: 1
  delay: SHORT_TERM
  description: Access to free or low-cost public WiFi allows street vendors to reliably
    accept digital payments and manage their business online without incurring high
    mobile data costs.
- from: aadhaar_authentication
  to: epf_balance
  type: AFFECTS
  weight: 0.9
  polarity: 1
  delay: IMMEDIATE
  description: The ability to access and withdraw EPF funds is often gated by successful
    Aadhaar-based e-KYC and authentication. System downtime or biometric failures
    can block access to savings.
- from: aadhaar_authentication
  to: mgnrega_wages
  type: AFFECTS
  weight: 0.8
  polarity: 1
  delay: SHORT_TERM
  description: Failures in the Aadhaar-Based Payment System (ABPS), often due to authentication
    issues, can lead to significant delays in the disbursal of wages to MGNREGA workers.
- from: aadhaar_authentication
  to: digilocker_documents
  type: DEPENDS_ON
  weight: 0.9
  polarity: 1
  delay: IMMEDIATE
  description: Accessing and using documents stored in DigiLocker often requires successful
    Aadhaar authentication. If the Aadhaar system is down, access to these digital
    documents is blocked.
- from: pan_aadhaar_linkage
  to: personal_income_tax
  type: REGULATES
  weight: 0.9
  polarity: 1
  delay: MEDIUM_TERM
  description: Failure to complete the mandatory PAN-Aadhaar linkage results in the
    PAN becoming inoperative, which prevents filing of income tax returns and can
    lead to higher TDS deductions.
- from: pan_aadhaar_linkage
  to: direct_equity_portfolio
  type: AFFECTS
  weight: 0.9
  polarity: 1
  delay: SHORT_TERM
  description: An inoperative PAN due to non-linkage with Aadhaar leads to the freezing
    of Demat and trading accounts, preventing investors from buying or selling stocks.
- from: digilocker_documents
  to: traffic_fines
  type: AFFECTS
  weight: 0.7
  polarity: -1
  delay: IMMEDIATE
  description: The legal acceptance of digital documents like driving licenses and
    vehicle RCs in DigiLocker allows citizens to avoid fines for not carrying physical
    copies.
- from: digilocker_documents
  to: educational_scholarships
  type: AFFECTS
  weight: 0.6
  polarity: 1
  delay: SHORT_TERM
  description: DigiLocker simplifies the scholarship application process by enabling
    students to easily share verified digital copies of marksheets and certificates
    with authorities.
- from: epramaan_and_sso
  to: epf_balance
  type: AFFECTS
  weight: 0.8
  polarity: 1
  delay: IMMEDIATE
  description: Government Single Sign-On (SSO) systems like ePramaan are the gateway
    to accessing the EPFO portal. The usability and uptime of the SSO directly impact
    a citizen's ability to view their PF balance.
- from: upi_transaction_success
  to: kirana_store_income
  type: AFFECTS
  weight: 0.8
  polarity: 1
  delay: SHORT_TERM
  description: High reliability of UPI payments encourages more customers to pay digitally,
    increasing transaction volume for kirana stores and reducing their reliance on
    managing physical cash.
- from: upi_transaction_success
  to: food_delivery_services
  type: AFFECTS
  weight: 0.7
  polarity: 1
