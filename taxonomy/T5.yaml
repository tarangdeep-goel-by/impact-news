- from: rural_urban_migration_corridors
  to: urban_population_density
  type: PRODUCES
  weight: 0.9
  polarity: 1
  delay: MEDIUM_TERM
  description: Sustained inflows of rural migrants into urban centers directly increase
    city population density and housing congestion.
  # Removed: urban_population_density → municipal_water_grid/sewage_drainage_network
  # These create a cycle with T4 edges (infra enables density). The dominant
  # causal direction (T4: infra → density) is kept. The reverse (density strains
  # infra) is a feedback loop forbidden by Rule 14.
  # Removed: tier_2_3_city_expansion → commercial_airports
  # Swapped direction per Gemini review: airport announcements catalyze city
  # expansion (T4→T5), not the reverse. See T4.yaml for restored edge.
- from: rural_urban_migration_corridors
  to: indian_railways_network
  type: DEPENDS_ON
  weight: 0.8
  polarity: 1
  delay: SHORT_TERM
  description: Mass movement of rural migrants to urban centers heavily relies on
    and increases passenger load on the Indian Railways network.
  # Removed: seasonal_migrant_labor → global_food_grain_supply
  # Creates 10-hop cycle. Indian migrant labor contributes to domestic harvest,
  # not global grain supply. Dubious causal claim removed per Rule 14.
