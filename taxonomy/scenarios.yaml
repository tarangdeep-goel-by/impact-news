  - id: trade_russia_to_grain
    description: "Russian government action reaches global food grain supply"
    domain: trade
    type: A
    trigger_node: russian_government
    target_node: global_food_grain_supply
    max_hops: 5
    expected: REACHABLE

  - id: trade_usd_reachability
    description: "USD/INR movement reaches petrol, diesel, and laptop costs"
    domain: trade
    type: B
    trigger_node: usd_inr_exchange
    target_nodes:
      - retail_petrol
      - retail_diesel
      - laptop_computer
    direction: 1
    threshold: 0.05

  # ============================================================
  # DOMAIN: tech (3 scenarios) — T-world triggered
  # ============================================================

  - id: tech_telecom_to_data
    description: "Telecom infrastructure affects mobile data tariff"
    domain: tech
    type: A
    trigger_node: digital_telecom_infrastructure
    target_node: mobile_data_tariff
    max_hops: 3
    expected: REACHABLE

  - id: tech_telecom_to_upi
    description: "Telecom infra disruption reaches UPI transaction success"
    domain: tech
    type: A
    trigger_node: digital_telecom_infrastructure
    target_node: upi_transaction_success
    max_hops: 5
    expected: REACHABLE

  - id: tech_semiconductor_to_phone
    description: "Global semiconductor shortage reaches smartphone prices"
    domain: tech
    type: A
    trigger_node: global_semiconductor_supply_chain
    target_node: smartphone_device
    max_hops: 4
    expected: REACHABLE

  # ============================================================
  # DOMAIN: social (4 scenarios) — T-world triggered
  # ============================================================

  - id: social_monsoon_to_savings
    description: "Monsoon deficit erodes household savings via food inflation"
    domain: social
    type: A
    trigger_node: southwest_monsoon
    target_node: savings_account_balance
    max_hops: 6
    expected: REACHABLE

  - id: social_confidence_reachability
    description: "Consumer confidence reaches kirana, savings, and credit cards"
    domain: social
    type: B
    trigger_node: aggregate_consumer_confidence
    target_nodes:
      - kirana_store_income
      - savings_account_balance
      - credit_card_dues
    direction: 1
    threshold: 0.05

  - id: social_inflation_score
    description: "Inflation indices have meaningful impact on savings"
    domain: social
    type: C
    trigger_node: inflation_indices
    target_node: savings_account_balance
    direction: 1
    min_score: 0.05

  - id: social_crude_to_tomato
    description: "Brent crude spike reaches retail tomato via freight costs"
    domain: social
    type: A
    trigger_node: brent_crude
    target_node: retail_tomato
    max_hops: 5
    expected: REACHABLE

  # ============================================================
  # DOMAIN: governance (3 scenarios)
  # ============================================================

  - id: governance_budget_reachability
    description: "Union budget reaches LPG and income tax"
    domain: governance
    type: B
    trigger_node: union_budget_framework
    target_nodes:
      - lpg_cylinder
      - personal_income_tax
