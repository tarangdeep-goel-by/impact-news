# scenarios.yaml — Seed scenarios for graph path validation
# 47 scenarios across 8 domains
# Types: A (path_exists), B (reachability), C (score_threshold)
# Mix: ~60% A, ~25% B, ~15% C, with ~10% negative tests

scenarios:

  # ============================================================
  # DOMAIN: energy (7 scenarios)
  # ============================================================

  - id: energy_crude_to_diesel
    description: "Brent crude spike reaches retail diesel"
    domain: energy
    type: A
    trigger_node: brent_crude
    target_node: retail_diesel
    max_hops: 4
    expected: REACHABLE

  - id: energy_crude_to_lpg
    description: "Brent crude price hike reaches LPG cylinder cost"
    domain: energy
    type: A
    trigger_node: brent_crude
    target_node: lpg_cylinder
    max_hops: 4
    expected: REACHABLE

  - id: energy_gold_to_loan
    description: "Gold price movement reaches gold loan interest"
    domain: energy
    type: A
    trigger_node: international_gold_prices
    target_node: gold_loan_interest
    max_hops: 4
    expected: REACHABLE

  - id: energy_natgas_to_auto
    description: "Natural gas price reaches auto rickshaw fare via CNG"
    domain: energy
    type: A
    trigger_node: global_natural_gas
    target_node: auto_rickshaw_fare
    max_hops: 4
    expected: REACHABLE

  - id: energy_coal_to_tariff
    description: "Coal prices affect electricity tariff"
    domain: energy
    type: A
    trigger_node: international_coal_prices
    target_node: electricity_tariff
    max_hops: 4
    expected: REACHABLE

  - id: energy_crude_reachability
    description: "Brent crude spike reaches diesel, petrol, LPG, and cooking fuel"
    domain: energy
    type: B
    trigger_node: brent_crude
    target_nodes:
      - retail_diesel
      - retail_petrol
      - lpg_cylinder
      - cooking_fuel
    direction: 1
    threshold: 0.05

  - id: energy_crude_to_savings_score
    description: "Brent crude shock propagates to savings with meaningful score"
    domain: energy
    type: C
    trigger_node: brent_crude
    target_node: savings_account_balance
    direction: 1
    min_score: 0.05

  # ============================================================
  # DOMAIN: monetary (7 scenarios)
  # ============================================================

  - id: monetary_rbi_to_emi
