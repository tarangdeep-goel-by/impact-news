  # ============================================================
  # DOMAIN: trade (4 scenarios)
  # ============================================================

  - id: trade_us_to_factory
    description: "US trade policy reaches Indian factory worker jobs"
    domain: trade
    type: A
    trigger_node: us_government
    target_node: factory_worker_jobs
    max_hops: 5
