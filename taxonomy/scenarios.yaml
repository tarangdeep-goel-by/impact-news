    direction: 1
    min_score: 0.05

  - id: governance_rbi_to_credit
    description: "RBI rate hike reaches credit card dues via lending rates"
    domain: governance
    type: A
    trigger_node: rbi
    target_node: credit_card_dues
    max_hops: 5
    expected: REACHABLE

  # ============================================================
  # CROSS-DOMAIN REACHABILITY (end-to-end T→I→I chains)
  # ============================================================

  - id: cross_rbi_reachability
    description: "RBI reaches EMI, deposits, and credit cards"
    domain: monetary
    type: B
    trigger_node: rbi
    target_nodes:
      - home_loan_emi
      - savings_and_deposits
      - credit_card_dues
    direction: 1
    threshold: 0.05

  - id: cross_fed_reachability
    description: "US Fed rate hike reaches IT salary, home loan EMI, and Nifty"
    domain: monetary
    type: B
    trigger_node: us_federal_reserve
    target_nodes:
      - it_sector_salary
      - home_loan_emi
      - nifty_50
    direction: 1
    threshold: 0.05

  - id: cross_monsoon_reachability
    description: "Monsoon reaches food prices, farm wages, and savings"
    domain: climate
    type: B
    trigger_node: southwest_monsoon
    target_nodes:
      - retail_rice
      - farm_labor_wages
      - savings_account_balance
    direction: 1
    threshold: 0.05

  - id: cross_gst_reachability
    description: "GST council reaches packaged food and biscuits"
    domain: monetary
    type: B
    trigger_node: gst_council
    target_nodes:
      - packaged_and_processed_foods
      - biscuits_and_snacks
    direction: 1
    threshold: 0.05

  # ============================================================
  # NEGATIVE TESTS (~10% — expected UNREACHABLE)
  # ============================================================

  - id: neg_gold_to_schools
    description: "Gold price should NOT reach school operations in 3 hops"
    domain: energy
    type: A
    trigger_node: international_gold_prices
    target_node: government_schools
    max_hops: 3
    expected: UNREACHABLE

  - id: neg_monsoon_to_nps
    description: "Monsoon should NOT directly reach NPS portfolio in 2 hops"
    domain: climate
    type: A
    trigger_node: southwest_monsoon
    target_node: nps_portfolio
    max_hops: 2
    expected: UNREACHABLE

  - id: neg_aadhaar_to_fish
    description: "Aadhaar auth should NOT reach marine fish stocks in 3 hops"
    domain: tech
    type: A
    trigger_node: aadhaar_authentication
    target_node: marine_fish_stocks
    max_hops: 3
    expected: UNREACHABLE

  - id: neg_nifty_to_diesel
    description: "Nifty should NOT directly reach diesel price in 2 hops"
    domain: monetary
    type: A
    trigger_node: nifty_50
    target_node: retail_diesel
    max_hops: 2
    expected: UNREACHABLE

  # ============================================================
  # CROSS-DOMAIN ISOLATION TESTS
  # ============================================================

  - id: gold_not_wheat
    description: "Gold prices should not reach wheat flour — separate commodity domains"
    domain: energy
    type: A
    trigger_node: international_gold_prices
    target_node: wheat_flour
    expected: UNREACHABLE

  - id: silver_not_petrol
    description: "Silver prices should not reach petrol in 3 hops"
    domain: energy
    type: A
    trigger_node: international_silver_prices
    target_node: retail_petrol
    max_hops: 3
    expected: UNREACHABLE

  - id: gold_not_retail_diesel
    description: "Gold prices should not directly reach diesel"
    domain: energy
    type: A
    trigger_node: international_gold_prices
    target_node: retail_diesel
    max_hops: 3
    expected: UNREACHABLE

  - id: coal_not_dairy
    description: "Coal prices should not reach dairy in 3 hops"
    domain: energy
    type: A
    trigger_node: international_coal_prices
    target_node: dairy_and_eggs
    max_hops: 3
    expected: UNREACHABLE

  - id: sensex_not_wheat
    description: "Stock index should not directly reach wheat flour"
    domain: monetary
    type: A
    trigger_node: sensex
    target_node: wheat_flour
    max_hops: 3
    expected: UNREACHABLE

  # ============================================================
  # PPR-SPECIFIC: Type D (ranking) and Type E (isolation)
  # ============================================================

  - id: d_crude_trade_over_emi
    description: "Crude oil should impact trade deficit more than home loan EMI"
    domain: energy
    type: D
    trigger_node: brent_crude
    higher_node: india_trade_deficit
    lower_node: home_loan_emi

  - id: d_monsoon_food_over_emi
    description: "Monsoon should impact food prices more than home loan EMI"
    domain: climate
    type: D
    trigger_node: southwest_monsoon
    higher_node: staple_grains
    lower_node: home_loan_emi

  - id: d_mpc_emi_over_tomato
    description: "MPC should impact EMI more than tomato price"
    domain: monetary
    type: D
    trigger_node: monetary_policy_committee
    higher_node: home_loan_emi
    lower_node: retail_tomato

  - id: d_fed_nifty_over_rice
    description: "US Fed should impact Nifty more than rice prices"
    domain: monetary
    type: D
    trigger_node: us_federal_reserve
    higher_node: nifty_50
    lower_node: retail_rice

  - id: e_gold_not_wheat
    description: "Gold prices should have near-zero PPR probability to wheat"
    domain: energy
    type: E
    trigger_node: international_gold_prices
    target_node: wheat_flour
    max_probability: 0.0005

  - id: e_silver_not_petrol
    description: "Silver prices should have near-zero PPR probability to petrol"
    domain: energy
    type: E
    trigger_node: international_silver_prices
    target_node: retail_petrol
    max_probability: 0.0005
