# scenarios.yaml — End-to-end scenario validation
# All scenarios trigger from T-world (news events) and trace to I-world (citizen impacts)
# Types: A (path_exists), B (reachability), C (score_threshold), D (ranking), E (isolation)

scenarios:

  # ============================================================
  # DOMAIN: energy (7 scenarios)
  # ============================================================

  - id: energy_crude_to_diesel
    description: "Brent crude spike reaches retail diesel"
    domain: energy
    type: A
    trigger_node: brent_crude
    target_node: retail_diesel
    max_hops: 4
    expected: REACHABLE

  - id: energy_crude_to_lpg
    description: "Brent crude price hike reaches LPG cylinder cost"
    domain: energy
    type: A
    trigger_node: brent_crude
    target_node: lpg_cylinder
    max_hops: 4
    expected: REACHABLE

  - id: energy_gold_to_loan
    description: "Gold price movement reaches gold loan interest"
    domain: energy
    type: A
    trigger_node: international_gold_prices
    target_node: gold_loan_interest
    max_hops: 4
    expected: REACHABLE

  - id: energy_natgas_to_auto
    description: "Natural gas price reaches auto rickshaw fare via CNG"
    domain: energy
    type: A
    trigger_node: global_natural_gas
    target_node: auto_rickshaw_fare
    max_hops: 4
    expected: REACHABLE

  - id: energy_coal_to_tariff
    description: "Coal prices affect electricity tariff"
    domain: energy
    type: A
    trigger_node: international_coal_prices
    target_node: electricity_tariff
    max_hops: 4
    expected: REACHABLE

  - id: energy_crude_reachability
    description: "Brent crude spike reaches diesel, petrol via direct causal chains"
    domain: energy
    type: B
    trigger_node: brent_crude
    target_nodes:
      - retail_diesel
      - retail_petrol
    direction: 1
    threshold: 0.05

  - id: energy_crude_to_savings_score
    description: "Brent crude shock propagates to savings with meaningful score"
    domain: energy
    type: C
    trigger_node: brent_crude
    target_node: savings_account_balance
    direction: 1
    min_score: 0.05

  # ============================================================
  # DOMAIN: monetary (7 scenarios)
  # ============================================================

  - id: monetary_rbi_to_emi
    description: "RBI policy reaches home loan EMI"
    domain: monetary
    type: A
    trigger_node: rbi
    target_node: home_loan_emi
    max_hops: 4
    expected: REACHABLE

  - id: monetary_rbi_to_emi_score
    description: "RBI has strong causal link to home loan EMI"
    domain: monetary
    type: C
    trigger_node: rbi
    target_node: home_loan_emi
    direction: 1
    min_score: 0.15

  - id: monetary_fed_to_nifty
    description: "US Fed rate decision reaches Nifty 50 via FII flows"
    domain: monetary
    type: A
    trigger_node: us_federal_reserve
    target_node: nifty_50
    max_hops: 4
    expected: REACHABLE

  - id: monetary_gst_to_food
    description: "GST council decision reaches packaged food prices"
    domain: monetary
    type: A
    trigger_node: gst_council
    target_node: packaged_and_processed_foods
    max_hops: 4
    expected: REACHABLE

  - id: monetary_budget_to_lpg
    description: "Union budget subsidy changes reach LPG cylinder price"
    domain: monetary
    type: A
    trigger_node: union_budget_framework
    target_node: lpg_cylinder
    max_hops: 4
    expected: REACHABLE

  - id: monetary_mpc_to_emi_score
    description: "MPC decision strongly affects home loan EMI"
    domain: monetary
    type: C
    trigger_node: monetary_policy_committee
    target_node: home_loan_emi
    direction: 1
    min_score: 0.15

  - id: monetary_nifty_to_nps
    description: "Nifty 50 movement reaches NPS portfolio value"
    domain: monetary
    type: A
    trigger_node: nifty_50
    target_node: nps_portfolio
    max_hops: 3
    expected: REACHABLE

  # ============================================================
  # DOMAIN: climate (7 scenarios) — all T-world triggered
  # ============================================================

  - id: climate_monsoon_to_rice
    description: "Southwest monsoon affects retail rice price"
    domain: climate
    type: A
    trigger_node: southwest_monsoon
    target_node: retail_rice
    max_hops: 4
    expected: REACHABLE

  - id: climate_monsoon_reachability
    description: "Southwest monsoon reaches rice, vegetables, and farm labor"
    domain: climate
    type: B
    trigger_node: southwest_monsoon
    target_nodes:
      - retail_rice
      - vegetables
      - farm_labor_wages
    direction: 1
    threshold: 0.05

  - id: climate_stubble_to_hospital
    description: "Post-monsoon stubble burning causes respiratory hospital admissions"
    domain: climate
    type: A
    trigger_node: meteorological_systems
    target_node: respiratory_conditions
    max_hops: 5
    expected: REACHABLE

  - id: climate_monsoon_to_labor
    description: "Monsoon disruption reduces outdoor construction worker wages"
    domain: climate
    type: A
    trigger_node: southwest_monsoon
    target_node: construction_worker_wages
    max_hops: 5
    expected: REACHABLE

  - id: climate_cyclone_to_fish
    description: "Cyclonic storms disrupt marine fish stocks"
    domain: climate
    type: A
    trigger_node: cyclonic_storm_systems
    target_node: marine_fish_stocks
    max_hops: 3
    expected: REACHABLE

  - id: climate_monsoon_to_schools
    description: "Monsoon-driven pollution forces school closures"
    domain: climate
    type: A
    trigger_node: meteorological_systems
    target_node: school_types
    max_hops: 6
    expected: REACHABLE

  - id: climate_himalayan_to_rice
    description: "Himalayan river system changes reach retail rice price"
    domain: climate
    type: A
    trigger_node: himalayan_river_systems
    target_node: retail_rice
    max_hops: 5
    expected: REACHABLE

  # ============================================================
  # DOMAIN: employment (4 scenarios) — T-world triggered
  # ============================================================

  - id: employment_fed_to_it_salary
    description: "US Fed policy reaches Indian IT sector salary via tech budgets"
    domain: employment
    type: A
    trigger_node: us_federal_reserve
    target_node: it_sector_salary
    max_hops: 5
    expected: REACHABLE

  - id: employment_budget_to_mgnrega
    description: "Union budget allocation reaches MGNREGA farm labor wages"
    domain: employment
    type: A
    trigger_node: union_budget_framework
    target_node: farm_labor_wages
    max_hops: 5
    expected: REACHABLE

  - id: employment_monsoon_to_farm_wages
    description: "Monsoon deficit affects farm labor wages"
    domain: employment
    type: A
    trigger_node: southwest_monsoon
    target_node: farm_labor_wages
    max_hops: 4
    expected: REACHABLE

  - id: employment_gdp_to_startup_layoffs
    description: "GDP slowdown triggers startup layoffs"
    domain: employment
    type: A
    trigger_node: india_gdp_growth
    target_node: startup_layoffs
