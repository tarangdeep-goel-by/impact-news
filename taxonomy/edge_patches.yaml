# =============================================================================
# DESCRIPTION FILLS — Edges in local_governance_graph that lack descriptions
# =============================================================================
# These fill in causal descriptions for 15 existing edges in the local governance graph.

description_fills:

  # Water system descriptions
  - from: monsoon
    to: reservoir_water_level
    description: "Monsoon rainfall is the primary inflow source for India's reservoirs; deficit monsoon years leave reservoirs at 50-60% capacity by October, triggering water rationing."

  - from: dam_water_release
    to: city_water_supply
    description: "Controlled dam releases feed intake points for municipal water treatment plants; release volume determines daily supply allocation per ward."

  - from: groundwater_depletion
    to: water_tanker_market
    description: "When borewells run dry in summer, residential colonies depend on private tankers at Rs 500-1500 per load; depletion drives a grey-market tanker economy."

  - from: water_rationing
    to: tanker_pricing
    description: "Municipal water rationing during scarcity creates demand spikes for private tankers; prices can triple during acute shortage periods."

  - from: water_pollution
    to: water_quality
    description: "Industrial effluent and untreated sewage discharge degrade source water quality, increasing treatment costs and health risks for downstream consumers."

  # Municipal/governance descriptions
  - from: property_tax
    to: municipal_revenue
    description: "Property tax is the single largest own-source revenue for municipal corporations; collection efficiency varies from 30% (smaller ULBs) to 85% (metro cities)."

  - from: municipal_expenditure
    to: road_maintenance
    description: "Road maintenance typically consumes 15-25% of municipal capital expenditure; underfunding leads to pothole-ridden roads that damage vehicles and cause accidents."

  - from: municipal_expenditure
    to: solid_waste_management
    description: "SWM costs Rs 1500-3000 per tonne including collection, transport, and processing; underfunding leads to open dumping and landfill fires."

  # Disaster/health descriptions
  - from: monsoon
    to: urban_flooding
    description: "Intense monsoon rainfall overwhelms encroached stormwater drains and silted lakes, causing urban flooding that paralyzes traffic and damages property."

  - from: urban_flooding
    to: traffic_management
    description: "Waterlogged roads force diversions, strand vehicles, and overwhelm traffic police; even 50mm rainfall can gridlock Indian metro cities for hours."

  - from: monsoon
    to: dengue
    description: "Stagnant water pools from monsoon rain become Aedes mosquito breeding grounds; dengue cases spike 3-4 weeks after heavy rainfall episodes."

  # Transport descriptions
  - from: diesel
    to: bus_fuel_cost
    description: "State transport corporations running diesel bus fleets see operating costs rise proportionally; a Rs 2/L diesel hike adds crores to monthly fuel bills."

  - from: metro_expansion
    to: real_estate_prices
    description: "Metro connectivity announcements cause 15-30% property price appreciation along planned corridors, even years before actual commissioning."

  - from: fuel_price_local
    to: auto_fare_meter
    description: "Auto-rickshaw fare meters are revised by RTAs when fuel prices cross threshold levels; CNG/petrol price hikes trigger fare revision demands."

  # Health description
  - from: hospital_staff_shortage
    to: public_healthcare
    description: "Government hospitals in India operate at 40-60% of sanctioned doctor strength; shortage means longer wait times, referrals to private hospitals, and out-of-pocket costs."
