# Edge Patches — Hand-written critical edges
# Applied by graph/merge.py after loading source files
# Created: 2026-03-10
#
# These are P0 cross-domain edges that connect the four source graphs:
#   employment_domain_graph.yaml, financial_system_domain_graph.yaml,
#   food_energy_graph.yaml, local_governance_graph.yaml
#
# Only references node IDs verified to exist in source files.

# =============================================================================
# EDGES (~50 cross-domain causal links)
# =============================================================================
edges:

  # =========================================================================
  # GROUP 1 — Energy → Consumer Prices
  # =========================================================================

  # Crude oil cascades
  - from: crude_oil
    to: petrol
    type: AFFECTS
    description: "India imports ~85% of crude oil; refinery input costs directly set petrol pump prices after OMC margin and taxes."

  - from: crude_oil
    to: diesel
    type: AFFECTS
    description: "Diesel pricing follows crude benchmarks with a lag; deregulated since 2014 but OMCs still smooth volatility."

  - from: crude_oil
    to: lpg
    type: AFFECTS
    description: "LPG is a refinery byproduct; global crude and propane/butane benchmarks determine the Saudi CP that sets Indian LPG costs."

  - from: crude_oil
    to: atf
    type: AFFECTS
    description: "Aviation turbine fuel is a middle distillate of crude; ATF prices revised fortnightly tracking Singapore benchmark."

  - from: crude_oil
    to: oil_import_bill
    type: AFFECTS
    description: "Crude accounts for ~25% of India's total import bill; every $10/bbl rise adds ~$15B to the annual oil import bill."

  # Fuel → transport/logistics
  - from: petrol
    to: logistics_sector
    type: AFFECTS
    description: "Last-mile delivery and two-wheeler logistics run on petrol; price hikes raise e-commerce and FMCG distribution costs."

  - from: diesel
    to: logistics_sector
    type: AFFECTS
    description: "Over 70% of Indian freight moves by road on diesel trucks; diesel cost is the single largest component of freight rates."

  - from: diesel
    to: bus_fuel_cost
    type: AFFECTS
    description: "State transport corporations and private bus operators pass diesel cost increases into fares, affecting daily commuters."

  # Natural gas cascades
  - from: natural_gas
    to: png_supply
    type: AFFECTS
    description: "PNG for household cooking depends on APM gas allocation and GAIL pipeline supply; gas price revisions flow to household bills."

  - from: natural_gas
    to: cng
    type: AFFECTS
    description: "CNG pricing is directly tied to domestic gas allocation under APM; PNGRB-regulated city gas distributors pass through price changes."

  - from: natural_gas
    to: electricity_tariff
    type: AFFECTS
    description: "Gas-based power plants (~7% of India's generation) face variable fuel costs; gas price hikes raise merit-order dispatch costs."

  # Coal → electricity
  - from: coal
    to: thermal_power
    type: SUPPLIES
    description: "Coal fuels ~70% of India's electricity; Coal India supplies ~80% of thermal plant feedstock."

  - from: coal
    to: electricity_tariff
    type: AFFECTS
    description: "Thermal generation costs dominate tariff calculations; coal price and railway freight increases are passed through via fuel surcharge adjustments."

  # =========================================================================
  # GROUP 2 — Monetary Policy → Consumer
  # =========================================================================

  # Repo rate → retail lending
  - from: repo_rate
    to: home_loan
    type: AFFECTS
    description: "Home loans benchmarked to repo rate (post-2019 RBI mandate) see EMI changes within one reset cycle of a repo rate move."

  - from: repo_rate
    to: auto_loan
    type: AFFECTS
    description: "Vehicle loans linked to MCLR/repo rate; a 25bps repo hike adds ~Rs 500/month to a Rs 8L car loan EMI."

  - from: repo_rate
    to: personal_loan
    type: AFFECTS
    description: "Personal loan rates are repo-linked for most banks; rate hikes increase EMI burden on unsecured borrowers."

  - from: repo_rate
    to: fd_rates
    type: AFFECTS
    description: "Banks raise FD rates after repo hikes to attract deposits; depositors benefit with a 1-2 quarter lag."

  - from: repo_rate
    to: mclr
    type: AFFECTS
    description: "MCLR is derived from repo rate plus spread; legacy loans still benchmarked to MCLR reprice with each reset."

  # Inflation → RBI → repo chain
  - from: cpi_inflation
    to: rbi_mpc
    type: AFFECTS
    description: "CPI is RBI's primary target (4% +/- 2%); sustained deviation triggers MPC rate action or stance change."

  - from: rbi_mpc
    to: repo_rate
    type: REGULATES
    description: "MPC votes on repo rate every 2 months; majority decision sets the policy rate that anchors all lending rates."

  - from: food_inflation_india
    to: cpi_inflation
    type: AFFECTS
    description: "India-specific food inflation (vegetables, cereals, pulses) drives CPI volatility given high basket weight."

  # =========================================================================
  # GROUP 3 — Agriculture → Food Prices
  # =========================================================================

  # Monsoon → crop → food
  - from: monsoon
    to: india_rice_production
    type: AFFECTS
    description: "Kharif rice is entirely rain-dependent; monsoon deficit of 10%+ typically cuts paddy output by 5-8%, pushing prices up."

  - from: monsoon
    to: wheat
    type: AFFECTS
    description: "Winter rabi wheat depends on residual soil moisture and reservoir levels from monsoon; poor monsoon reduces rabi sowing area."

  - from: monsoon
    to: vegetable_prices
    type: AFFECTS
    description: "Excess rain damages perishable crops (tomato, onion); deficit dries up supply — either extreme causes sharp price spikes."

  - from: monsoon
    to: groundwater
    type: AFFECTS
    description: "Monsoon recharge is the primary source of India's groundwater; deficit years accelerate aquifer depletion and raise irrigation costs."

  - from: vegetable_prices
    to: food_inflation_india
    type: AFFECTS
    description: "Vegetables carry ~6% weight in India's CPI food basket; sharp spikes in onion, tomato, and potato prices are the most common driver of food inflation surges."

  - from: india_rice_production
    to: food_inflation_india
    type: AFFECTS
    description: "Rice has the highest weight in India's food CPI; production shortfalls from poor monsoon directly push up retail rice prices and overall food inflation."

  # MSP → farmer income and food prices
  - from: msp_policy
    to: india_rice_production
    type: AFFECTS
    description: "MSP guarantees a floor price for paddy procurement by FCI; higher MSP incentivizes more rice sowing area."

  - from: msp_policy
    to: fci
    type: AFFECTS
    description: "MSP determines FCI's procurement cost; higher MSP raises food subsidy bill and buffer stock carrying costs."

  - from: fci
    to: pds
    type: SUPPLIES
    description: "FCI procures, stores, and distributes grain through the PDS network; FCI stock levels determine PDS supply adequacy."

  # Fertilizer → farming costs → food prices
  - from: fertilizer
    to: food_inflation_india
    type: AFFECTS
    description: "Fertilizer is 15-20% of Indian farming input costs; urea and DAP price rises flow through to crop production costs and food prices."

  - from: urea
    to: food_inflation_india
    type: AFFECTS
    description: "Urea is the most-used fertilizer in India; subsidy reductions or supply shortages directly raise farmer input costs."

  # =========================================================================
  # GROUP 4 — Forex → Economy
  # =========================================================================

  # USD-INR linkages
  - from: inr_usd
    to: crude_oil
    type: AFFECTS
    description: "A weaker rupee makes dollar-denominated crude more expensive in INR terms, amplifying the oil import bill."

  - from: crude_oil
    to: inr_usd
    type: AFFECTS
    description: "Rising crude widens the trade deficit and increases dollar demand for oil payments, depreciating the rupee."

  - from: inr_usd
    to: it_export_earnings
    type: AFFECTS
    description: "IT companies earn in USD; a 1% rupee depreciation adds ~40bps to IT sector margins in INR terms."

  - from: inr_usd
    to: gold
    type: AFFECTS
    description: "Gold is priced in USD; rupee depreciation makes gold costlier in India even when international prices are flat."

  - from: us_fed
    to: inr_usd
    type: AFFECTS
    description: "Fed rate hikes strengthen the dollar globally and widen the India-US rate differential, pulling capital out and weakening INR."

  # FII/FPI flows
  - from: fii_flows
    to: nifty_50
    type: AFFECTS
    description: "FIIs own ~17% of NSE free float; sustained FII selling creates downward pressure on Nifty 50 and broader markets."

  - from: fii_flows
    to: inr_usd
    type: AFFECTS
    description: "FII outflows mean dollar demand as foreign investors repatriate; large outflows ($3B+/month) visibly weaken the rupee."

  - from: us_fed
    to: fii_flows
    type: AFFECTS
    description: "Fed tightening raises US yields, making EM carry trades less attractive and triggering FII outflows from India."

  # =========================================================================
  # GROUP 5 — Markets
  # =========================================================================

  - from: nifty_50
    to: equity_mf
    type: AFFECTS
    description: "Nifty 50 is the benchmark for most large-cap equity MFs and index funds; its performance drives retail investor returns."

  - from: sensex
    to: equity_mf
    type: AFFECTS
    description: "Sensex tracks 30 large-caps and serves as the BSE benchmark; market sentiment flows through to MF NAVs."

  - from: rbi_mpc
    to: gsec_yield
    type: AFFECTS
    description: "MPC rate decisions directly impact G-Sec yields; a surprise repo hike can move 10Y yield by 10-15bps intraday."

  - from: crude_oil
    to: trade_deficit
    type: AFFECTS
    description: "Oil is India's largest import item; crude price swings are the primary driver of trade deficit volatility."

  - from: trade_deficit
    to: inr_usd
    type: AFFECTS
    description: "A widening trade deficit increases net dollar demand in the forex market, putting depreciation pressure on the rupee."

  # =========================================================================
  # GROUP 6 — Governance → Daily Life
  # =========================================================================

  - from: property_tax
    to: municipal_revenue
    type: FUNDS
    description: "Property tax is the largest own-source revenue for Indian municipal corporations, funding roads, water, and sanitation."

  - from: gst
    to: gst_municipal
    type: AFFECTS
    description: "GST subsumed octroi and local body taxes; municipalities now depend on GST compensation from centre/state."

  - from: income_tax
    to: salary_trends
    type: AFFECTS
    description: "Income tax slab changes (new vs old regime) alter take-home pay; higher exemptions increase disposable income for salaried class."

  - from: electricity_tariff
    to: electricity_bill
    type: AFFECTS
    description: "Tariff revisions by state electricity regulatory commissions directly change monthly household electricity bills."

  - from: gst
    to: food_inflation_india
    type: AFFECTS
    description: "GST on packaged food items (5-18%) adds to retail food costs; rate changes on essentials impact household budgets."

  # =========================================================================
  # GROUP 7 — Cross-Domain Bridges
  # =========================================================================

  - from: cpi_inflation
    to: salary_trends
    type: AFFECTS
    description: "Persistent inflation erodes real wages; companies adjust annual increments and DA (dearness allowance) to compensate."

  - from: india_gdp
    to: job_market_india
    type: AFFECTS
    description: "GDP growth rate is the primary driver of formal job creation; sub-6% growth typically means weaker hiring cycles."

  - from: china_economy
    to: crude_oil
    type: AFFECTS
    description: "China is the world's largest crude importer; its economic slowdown reduces global oil demand and prices."

  - from: china_economy
    to: gold
    type: AFFECTS
    description: "China is the largest gold consumer; its central bank buying and consumer demand shifts move global gold prices."

  - from: geopolitical_risk
    to: crude_oil
    type: AFFECTS
    description: "Middle East tensions, Russia sanctions, or Strait of Hormuz risks create supply fears that spike crude prices globally."

  - from: geopolitical_risk
    to: gold
    type: AFFECTS
    description: "Gold is the classic safe-haven asset; geopolitical escalation drives flight-to-safety buying and price spikes."

  - from: climate_change
    to: monsoon
    type: AFFECTS
    description: "Climate change is increasing monsoon variability — more extreme rainfall events, longer dry spells, and shifting onset dates."

  - from: climate_change
    to: heatwave
    type: AFFECTS
    description: "Rising global temperatures are increasing heatwave frequency and intensity across India, straining power grids and agriculture."

  - from: heatwave
    to: electricity_tariff
    type: AFFECTS
    description: "Heatwaves spike cooling demand, pushing peak electricity load and forcing expensive peaking power purchases that raise costs."

  - from: drought
    to: food_inflation_india
    type: AFFECTS
    description: "Drought years reduce kharif output and deplete reservoirs; the resulting food supply shock pushes up CPI food component."

  - from: crude_oil
    to: fertilizer
    type: AFFECTS
    description: "Natural gas (linked to crude) is the primary feedstock for urea manufacturing; crude price rises increase fertilizer production costs."

  - from: inr_usd
    to: crude_oil
    type: AFFECTS
    description: "Rupee depreciation against the dollar increases the effective INR cost of crude oil imports for Indian refineries."

  - from: oil_import_bill
    to: trade_deficit
    type: AFFECTS
    description: "Oil imports constitute ~25% of India's total import bill; oil price swings are the dominant driver of trade balance changes."

  - from: renewable_energy
    to: coal
    type: COMPETES_WITH
    description: "Growing solar and wind capacity displaces coal in the merit order; India targets 500GW non-fossil capacity by 2030."

  - from: stubble_burning
    to: food_inflation_india
    type: AFFECTS
    description: "Stubble burning bans can delay rabi sowing if farmers lack alternatives, potentially affecting wheat supply timing."

