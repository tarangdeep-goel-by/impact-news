    to: employment_and_income
    type: AFFECTS
    description: "EPFO payroll data is India's primary proxy for formal job creation, tracking new subscribers as a measure of organized sector employment."

  - from: female_labor_force_participation
    to: india_gdp
    type: AFFECTS
    description: "India's female LFPR at ~25% is among the lowest globally; increasing it could add significantly to GDP growth."

  - from: aadhaar_kyc
    to: welfare_schemes
    type: AFFECTS
    description: "Aadhaar-based KYC is mandatory for accessing most government welfare schemes via Direct Benefit Transfer."

  - from: model_code_of_conduct
    to: municipal_elections
    type: REGULATES
    description: "The Model Code of Conduct halts all new government tenders, projects, and welfare announcements for months before elections."

  - from: lpg_cylinder
    to: consumer
    type: AFFECTS
    description: "LPG cylinder prices directly impact household cooking fuel budgets; India has over 31 crore active LPG connections under Ujjwala and others."

  - from: crude_oil
    to: lpg_cylinder
    type: AFFECTS
    description: "LPG is a petroleum derivative; global crude oil and Saudi Aramco contract prices determine domestic LPG cylinder costs."

  - from: railway_fares
    to: consumer
    type: AFFECTS
    description: "Indian Railways carries 8+ billion passengers annually; fare revisions directly affect travel budgets of the masses."

  - from: rto_services
    to: consumer
    type: AFFECTS
    description: "RTO services (driving licenses, vehicle registration, fitness certificates) are a frequent citizen-government touchpoint affecting vehicle ownership costs."

  - from: stormwater_drains
    to: urban_flooding
    type: AFFECTS
    description: "Clogged or encroached stormwater drains are the primary structural cause of urban flooding in Indian cities."

  - from: water_tanker_services
    to: consumer
    type: AFFECTS
    description: "When municipal water supply fails, urban consumers depend on private water tankers at 5-10x the cost of piped water."

  - from: city_water_supply
    to: water_tanker_services
    type: AFFECTS
    description: "Municipal water shortages force households to rely on expensive private water tanker services."

  - from: aviation_turbine_fuel
    to: domestic_flights
    type: AFFECTS
    description: "ATF prices make up ~40% of airline operating costs in India; price hikes directly cause spikes in domestic airfares."

  - from: crude_oil
    to: aviation_turbine_fuel
    type: AFFECTS
    description: "ATF is refined from crude oil; global crude benchmarks determine aviation fuel costs for Indian carriers."


# =============================================================================
# NODE MERGES — Duplicate nodes across source files
# =============================================================================
# keep = canonical ID (in the primary source file for that domain)
# merge = duplicate ID (in a cross-domain reference file)

node_merges:

  # crude_oil_price merged into crude_oil (already handled — same ID in source files)
  # - keep: crude_oil
  #   merge: crude_oil_price

  # petrol (food_energy) vs petrol_price (employment)
  - keep: petrol
    merge: petrol_price

  # diesel (food_energy) vs diesel_price (local_governance) vs diesel_prices (employment)
  - keep: diesel
    merge: diesel_price

  - keep: diesel
    merge: diesel_prices

  # inr_usd (financial) vs rupee_dollar (food_energy)
  - keep: inr_usd
    merge: rupee_dollar

  # inr_usd (financial) vs inr_usd_freelance (employment) — NOT a merge, different concept
  # inr_usd_freelance is specifically about freelancer forex impact, keep separate

  # --- Same-ID duplicates across source files ---
  # These nodes appear with identical IDs in multiple source files.
  # merge.py should deduplicate by keeping the node from the canonical source
  # and dropping duplicates from other sources, preserving all edges.
  #
  # Format: canonical_source is the file whose node definition wins.
  # duplicate_sources list the files whose duplicate node defs are dropped.

  - keep: repo_rate
    canonical_source: financial_system_domain_graph
    duplicate_sources: [employment_domain_graph]

