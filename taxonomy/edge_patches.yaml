  - from: union_budget
    to: defense_spending
    type: FUNDS
    description: "Defence receives the largest single allocation in India's Union Budget (~13% of total expenditure); budget size determines force modernisation and procurement pace."

  - from: emergency_services
    to: health_insurance
    type: AFFECTS
    description: "Emergency hospitalisations and ambulance costs drive health insurance claim volumes, pushing up premiums across India's general insurance sector."

  # Component 4: demographics_and_social (16 nodes)
  - from: urbanization
    to: real_estate_prices
    type: AFFECTS
    description: "Rapid urbanization drives housing demand in tier-1 and tier-2 cities, pushing up real estate prices and rental costs for urban migrants."

  - from: population_growth
    to: india_gdp
    type: AFFECTS
    description: "India's demographic dividend — 65% working-age population — drives GDP growth through labor supply expansion and rising domestic consumption."

  - from: housing_for_poor
    to: affordable_housing
    type: DEPENDS_ON
