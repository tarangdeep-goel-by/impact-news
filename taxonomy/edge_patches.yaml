  # GROUP 8 — Bridge edges connecting isolated components to main graph
  # =========================================================================

  # Component 2: recreation_and_culture (24 nodes)
  - from: gst
    to: entertainment
    type: REGULATES
    description: "GST at 18-28% applies to cinema tickets, amusement parks, and live events; rate changes directly alter entertainment costs for Indian consumers."

  - from: recreation_and_culture
    to: cpi_inflation
    type: AFFECTS
    description: "Recreation and culture spending forms part of the CPI miscellaneous basket (~15% weight); rising entertainment costs contribute to headline inflation."

