canaries:
- id: canary_t1_monsoon_agri
  trigger: southwest_monsoon
  direction: -1
  must_include_top: 10
  must_include: [retail_rice, retail_onion]
  description: "Natural: Weak southwest monsoon drives up prices of staple grains and vegetables"

- id: canary_t1_heat_health
  trigger: outdoor_heat
  direction: 1
  must_include_top: 15
  must_include: [residential_power_supply, cholera_and_diarrhea]
  description: "Natural: Extreme outdoor heat spikes residential power demand and water-borne diseases"

- id: canary_t1_glacier_hazards
  trigger: himalayan_glaciers
  direction: -1
  must_include_top: 15
  must_include: [municipal_water_supply, structural_collapse]
  description: "Natural: Himalayan glacier retreat threatens municipal water supply and causes structural hazards"

- id: canary_t1_cyclone_transit
  trigger: cyclonic_storm_systems
  direction: 1
  must_include_top: 10
  must_include: [domestic_flight_ticket, marine_fish]
  description: "Natural: Cyclonic storms disrupt domestic flights and coastal marine fishing"

- id: canary_t2_rbi_rates
  trigger: rbi
  direction: 1
  must_include_top: 5
  must_include: [home_loan_emi, fixed_deposits]
  description: "Institutions: RBI monetary policy directly dictates home loan EMIs and fixed deposit rates"

- id: canary_t2_fssai_food
  trigger: fssai
  direction: 1
  must_include_top: 10
  must_include: [street_food, nutritional_supplements]
  description: "Institutions: FSSAI regulations impact street food vendors and nutritional supplement compliance"

- id: canary_t2_municipal_civic
  trigger: municipal_corporations
  direction: -1
  must_include_top: 10
  must_include: [street_garbage, dengue]
  description: "Institutions: Poor municipal corporation performance leads to street garbage and dengue outbreaks"

- id: canary_t2_education_welfare
  trigger: ministry_of_education
  direction: 1
  must_include_top: 10
  must_include: [cbse_exams, mid_day_meal]
  description: "Institutions: Ministry of Education policies directly affect CBSE exams and mid-day meal programs"

- id: canary_t3_crude_transport
  trigger: brent_crude
  direction: 1
  must_include_top: 5
  must_include: [retail_petrol, cab_aggregator_fare]
  description: "Markets: Brent crude prices pass directly to retail petrol and cab aggregator fares"

- id: canary_t3_gold_weddings
  trigger: international_gold_prices
  direction: 1
  must_include_top: 10
  must_include: [retail_gold_investment, wedding_planning_service]
  description: "Markets: International gold prices heavily influence retail gold investment and wedding budgets"

- id: canary_t3_edible_oil_groceries
  trigger: global_edible_oil_supply
  direction: -1
  must_include_top: 10
  must_include: [mustard_oil, palm_oil]
  description: "Markets: Global edible oil supply shortages drive up retail mustard and palm oil prices"

- id: canary_t3_unemployment_wages
  trigger: national_unemployment_rate
  direction: 1
  must_include_top: 15
  must_include: [it_sector_jobs, mgnrega_wages]
  description: "Markets: High national unemployment impacts IT sector job availability and drives MGNREGA demand"

- id: canary_t4_upi_retail
  trigger: upi_platform
  direction: -1
  must_include_top: 10
  must_include: [upi_transaction_success, kirana_store_income]
  description: "Infrastructure: UPI platform outages reduce transaction success and hurt kirana store income"

- id: canary_t4_railways_labor
  trigger: indian_railways_network
  direction: 1
  must_include_top: 15
  must_include: [irctc_train_ticket, construction_worker_wages]
  description: "Infrastructure: Railway network expansion boosts IRCTC ticketing and construction worker wages"

- id: canary_t4_fibre_entertainment
  trigger: optical_fibre_network
  direction: 1
  must_include_top: 10
  must_include: [fiber_broadband_tariff, ott_subscription]
  description: "Infrastructure: Optical fibre expansion lowers broadband tariffs and boosts OTT subscriptions"

- id: canary_t4_power_industry
  trigger: national_power_grid
  direction: -1
  must_include_top: 10
  must_include: [residential_power_supply, small_factory_owner_income]
  description: "Infrastructure: National power grid failures disrupt residential supply and MSME factory income"

- id: canary_t5_festivals_travel
  trigger: autumn_festive_season
  direction: 1
  must_include_top: 10
  must_include: [festive_idol, intercity_bus_fare]
  description: "Social: Autumn festive season drives demand for festive idols and spikes intercity bus fares"

- id: canary_t5_urbanization_housing
  trigger: urban_population_density
  direction: 1
  must_include_top: 15
  must_include: [residential_rent, traffic_congestion]
  description: "Social: Increasing urban density drives up residential rents and worsens traffic congestion"

- id: canary_t5_migration_services
  trigger: rural_urban_migration_corridors
  direction: 1
  must_include_top: 15
  must_include: [pg_and_hostel_fees, domestic_help_wages]
  description: "Social: Rural-urban migration increases PG hostel demand and stabilizes domestic help wages"

- id: canary_lateral_smog_health
  trigger: winter_smog
  direction: 1
  must_include_top: 10
  must_include: [asthma, doctor_consultation]
  description: "Lateral: Severe winter smog directly exacerbates asthma and increases doctor consultations"

- id: canary_lateral_waterlogging_accidents
  trigger: street_waterlogging
  direction: 1
  must_include_top: 10
  must_include: [traffic_congestion, road_traffic_accidents]
  description: "Lateral: Street waterlogging causes severe traffic congestion and road traffic accidents"

- id: canary_lateral_scams_security
  trigger: upi_and_bank_scams
  direction: 1
  must_include_top: 10
  must_include: [fir_registration, personal_data_privacy]
  description: "Lateral: Rising UPI scams lead to increased FIR registrations and personal data privacy concerns"

- id: canary_lateral_education_loans
  trigger: engineering_education
  direction: 1
  must_include_top: 15
  must_include: [personal_loan_emi, private_tutors]
  description: "Lateral: High engineering education costs drive demand for personal loans and private tutors"

- id: canary_cross_semiconductor_devices
  trigger: global_semiconductor_supply_chain
  direction: -1
  must_include_top: 15
  must_include: [laptop_computer, smartphone_device]
  description: "Cross-world: Global semiconductor supply chain disruptions increase laptop and smartphone prices"

- id: canary_cross_inflation_wages
  trigger: wpi
  direction: 1
  must_include_top: 15
  must_include: [minimum_wage, kirana_store_income]
  description: "Cross-world: High WPI inflation forces minimum wage hikes and impacts kirana store margins"