- from: home_loan_emi
  to: personal_income_tax
  type: AFFECTS
  weight: 0.8
  polarity: -1
  delay: MEDIUM_TERM
  description: Home loan principal and interest payments provide tax deductions under
    sections 80C and 24(b), reducing overall personal income tax liability.
- from: life_insurance
  to: personal_income_tax
  type: AFFECTS
  weight: 0.7
  polarity: -1
  delay: MEDIUM_TERM
  description: Life insurance premiums qualify for Section 80C deductions, directly
    lowering taxable income and personal income tax.
- from: health_insurance_premium
  to: personal_income_tax
  type: AFFECTS
  weight: 0.7
  polarity: -1
  delay: MEDIUM_TERM
  description: Health insurance premiums provide tax deductions under Section 80D,
    reducing the individual's income tax burden.
- from: ppf_investment
  to: personal_income_tax
  type: AFFECTS
  weight: 0.8
  polarity: -1
  delay: MEDIUM_TERM
  description: Contributions to the Public Provident Fund (PPF) are fully deductible
    under Section 80C, lowering personal income tax.
- from: nps_portfolio
  to: personal_income_tax
  type: AFFECTS
  weight: 0.7
  polarity: -1
  delay: MEDIUM_TERM
  description: Investments in the National Pension System (NPS) offer exclusive tax
    deductions under Section 80CCD(1B), reducing income tax.
- from: fixed_deposits
  to: tds_deduction
  type: PRODUCES
  weight: 0.9
  polarity: 1
  delay: IMMEDIATE
  description: Interest earned on fixed deposits exceeding the exemption limit automatically
    triggers Tax Deducted at Source (TDS) by banks.
- from: direct_equity_portfolio
  to: capital_gains_tax
  type: PRODUCES
  weight: 0.8
  polarity: 1
  delay: SHORT_TERM
  description: Profits booked from selling direct equity holdings generate Short-Term
    or Long-Term Capital Gains (STCG/LTCG) tax liabilities.
- from: mutual_funds
  to: capital_gains_tax
  type: PRODUCES
  weight: 0.8
  polarity: 1
  delay: SHORT_TERM
  description: Redeeming mutual fund units at a profit incurs capital gains tax, with
    rates varying by holding period and fund type.
- from: investment_property_value
  to: capital_gains_tax
  type: PRODUCES
  weight: 0.9
  polarity: 1
  delay: SHORT_TERM
  description: Selling investment real estate at an appreciated value directly triggers
    significant Long-Term Capital Gains (LTCG) tax.
- from: cryptocurrency_portfolio
  to: tds_deduction
  type: PRODUCES
  weight: 0.9
  polarity: 1
  delay: IMMEDIATE
  description: Selling or trading cryptocurrency assets mandates a 1% TDS deduction
    under Section 194S of Indian tax regulations.
- from: cryptocurrency_portfolio
  to: capital_gains_tax
  type: PRODUCES
  weight: 0.9
  polarity: 1
  delay: SHORT_TERM
  description: Profits from cryptocurrency investments are taxed at a flat 30% rate
    under Section 115BBH, significantly increasing capital gains tax liability.
- from: ipo_allotment
  to: direct_equity_portfolio
  type: SUPPLIES
  weight: 1.0
  polarity: 1
  delay: IMMEDIATE
  description: Successful allotment of shares in an Initial Public Offering (IPO)
    directly adds new stocks to the retail investor's direct equity portfolio.
- from: credit_card_dues
  to: personal_loan_emi
  type: PRODUCES
  weight: 0.6
  polarity: 1
  delay: SHORT_TERM
  description: Accumulation of high-interest credit card dues often forces consumers
    to take personal loans for debt consolidation, increasing personal loan EMIs.
- from: retail_gold_investment
  to: gold_loan_interest
  type: SUPPLIES
  weight: 0.7
  polarity: 1
  delay: IMMEDIATE
  description: Holding physical retail gold provides the necessary collateral to access
    gold loans, enabling the generation of gold loan interest obligations.
- from: savings_account_balance
  to: mutual_funds
  type: FUNDS
  weight: 0.8
  polarity: 1
  delay: IMMEDIATE
  description: Surplus liquidity in savings accounts is the primary funding source
    for systematic investment plans (SIPs) and lump-sum mutual fund investments.
- from: savings_account_balance
  to: equity_investments
  type: FUNDS
  weight: 0.7
  polarity: 1
  delay: IMMEDIATE
  description: Available balances in retail savings accounts are transferred to trading
    accounts to fund direct equity and IPO investments.
- from: personal_income_tax
  to: savings_account_balance
  type: AFFECTS
  weight: 0.9
  polarity: -1
  delay: IMMEDIATE
  description: Higher personal income tax outflows directly reduce the disposable
    income available to be retained in savings accounts.
- from: home_loan_emi
  to: savings_account_balance
  type: AFFECTS
  weight: 0.8
  polarity: -1
  delay: IMMEDIATE
  description: Monthly deductions for home loan EMIs directly deplete the available
    balance in household savings accounts.
